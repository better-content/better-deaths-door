name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BC_CUSTOM_MOD_JAR_DIR: ${{ github.workspace }}/build/ci-provider-jars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check out pinned HUD API provider
        uses: actions/checkout@v4
        with:
          repository: better-content/better-survival-hud
          ref: d3822667f74883052f1521c2c03ec86d1c26311f
          path: build/ci-hud-provider
      - name: Stage pinned HUD API provider
        run: |
          ./build/ci-hud-provider/gradlew -p build/ci-hud-provider --no-daemon stageRuntimeJar
          mkdir -p "$BC_CUSTOM_MOD_JAR_DIR"
          cp build/ci-hud-provider/build/libs/better-survival-hud-1.0.0.jar "$BC_CUSTOM_MOD_JAR_DIR/"
      - name: Verify repository
        run: ./gradlew --no-daemon verifyFull
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-verification
          path: |
            build/reports/
            build/test-results/
            build/ci-provider-jars/providers.json
          if-no-files-found: ignore
          retention-days: 14
