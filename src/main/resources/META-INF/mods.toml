modLoader="javafml"
loaderVersion="[47,)"
license="AGPL-3.0-or-later"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/better-content/better-deaths-door"
issueTrackerURL="https://github.com/better-content/better-deaths-door/issues"
authors="Better Content"
description='''
At zero HP, keep fighting. Server-authoritative regional injuries, treatment, and borrowed time.
'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="[${forge_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="[${minecraft_version},1.21)"
ordering="NONE"
side="BOTH"

# Stable patch releases require structural renderer admission; Mantle remains optional.
[[dependencies.${mod_id}]]
modId="mantle"
mandatory=false
versionRange="[1.11.104,1.12)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="better_survival_hud"
mandatory=false
versionRange="[1.0.0,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="better_gameplay_notices"
mandatory=true
versionRange="[1.0.0,)"
ordering="AFTER"
side="CLIENT"
